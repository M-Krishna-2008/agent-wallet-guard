services:
  - type: web
    name: agent-wallet-guard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agent-wallet-guard-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MOCK
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_LIVE
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: VENDOR_SANDBOX_EMAIL
        sync: false

databases:
  - name: agent-wallet-guard-db
    databaseName: guard
    user: guard_user
    plan: free

